<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تقویم فارسی، مناسبت‌ها، تبدیل تاریخ، اوقات شرعی و نجوم — Persian Calendar">
  <title>تقویم فارسی · Persian Calendar</title>
  <style>
    html, body, #app { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#fcfcff; color:#191c1e; font:16px system-ui,sans-serif; }
    #loading { position:absolute; inset:0; display:grid; place-content:center; text-align:center; padding:24px; }
    #status { position:fixed; bottom:0; left:1rem; right:1rem; text-align:center; background:#191c1e; color:white; z-index:10; }
    #status:empty { display:none; }
  </style>
  <script src="platform.js"></script>
</head>
<body>
  <main id="app" aria-label="Persian Calendar"></main>
  <div id="loading" role="status">در حال بارگذاری تقویم…<br>Loading Persian Calendar…</div>
  <p id="status" role="status" aria-live="polite"></p>
  <noscript>برای نمایش تقویم، جاوااسکریپت را فعال کنید. JavaScript is required.</noscript>
  <script>
    const script = document.createElement('script');
    script.src = 'persian-calendar.js';
    script.onerror = () => globalThis.calendarPlatform.loadError();
    window.addEventListener('unhandledrejection', () => {
      if (document.getElementById('loading')) globalThis.calendarPlatform.loadError();
    });
    document.body.append(script);
  </script>
</body>
</html>
