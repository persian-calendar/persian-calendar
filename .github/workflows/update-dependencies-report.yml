name: Update dependencies report

on:
  workflow_call:
    inputs:
      ref:
        description: Branch or ref to check out and push the report to
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Regenerate dependency reports
        run: ./gradlew PersianCalendar:updateDependenciesReport wear:updateDependenciesReport

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersianCalendar/runtime-dependencies-report.txt wear/runtime-dependencies-report.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update the runtime dependencies report"
          git push origin "HEAD:${{ inputs.ref }}"
