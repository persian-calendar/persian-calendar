name: Notify

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Notify via Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Send the message
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          work="$(mktemp -d)"
          : > "$work/responses.jsonl"

          # Keep these labels in sync with the job names mapped in
          # notify-build-status.yml. They are escaped for the HTML parse mode.
          pending_block=$'⏳ Build, lint &amp; JVM tests\n⏳ UI tests'

          jq -c --arg chat_id "$TELEGRAM_CHAT_ID" --arg pending "$pending_block" '
            # Telegram counts the 4096 character limit in UTF-16 code units.
            def w: if . > 65535 then 2 else 1 end;
            def u16len: [explode[] | w] | add // 0;
            def u16cut($n):
              reduce explode[] as $cp ({out: [], used: 0};
                ($cp | w) as $k
                | if .used + $k > $n then . else .used += $k | .out += [$cp] end)
              | .out | implode;

            # These are the only characters that need escaping in Telegram HTML mode.
            def esc: gsub("(?<a>[<>&\"])"; .a | @html);

            def body($max):
              (.message // "")
              | gsub("\r\n"; "\n")
              | if u16len > $max then u16cut($max) + "…" else . end
              | esc
              # Guards against input where escaping multiplies the size up to 5x.
              | if u16len > 2600
                then (u16cut(2600) | sub("&[A-Za-z0-9#]*$"; ""))
                else . end;

            def entry:
              "<a href=\"\(.url | esc)\">\(.id[:8] | esc)</a> • "
              + (if .author.username then
                   (.author.username | esc) as $user
                   | "<a href=\"https://github.com/\($user)\">\($user)</a>"
                 else (.author.name // "unknown" | esc) end)
              + "\n\n" + body(3000);

            def signature($i; $n):
              if $n > 1 then "📅 @Persian_Calendar • \($i)/\($n)"
              else "📅 @Persian_Calendar" end;

            # The last message ends with a pending line per job; the
            # build-status workflow swaps that exact block for the results.
            def footer($i; $n):
              (if $i == $n then $pending + "\n\n" else "" end)
              + signature($i; $n);

            # Pack whole commits into messages of at most 3700 UTF-16 units.
            # 3700 rather than 4096: room is reserved for the pending line that
            # is later replaced by the CI result.
            def chunk($budget):
              reduce .[] as $e ({chunks: [], cur: [], size: 0};
                ($e | u16len) as $w
                | if (.cur | length) == 0 then .cur = [$e] | .size = $w
                  elif .size + 2 + $w > $budget then .chunks += [.cur] | .cur = [$e] | .size = $w
                  else .cur += [$e] | .size += 2 + $w end)
              | .chunks + (if (.cur | length) > 0 then [.cur] else [] end);

            ((. // []) | if type == "array" then . else [] end) as $commits
            | [$commits[] | entry] as $entries
            | ($entries | chunk(3700)) as $chunks
            | ($chunks | length) as $n
            | range(0; $n) as $i
            | {
                chat_id: $chat_id,
                parse_mode: "HTML",
                disable_web_page_preview: true,
                text: (($chunks[$i] | join("\n\n")) + "\n\n" + footer($i + 1; $n))
              }
          ' <<<"$COMMITS" > "$work/requests.jsonl"

          while IFS= read -r payload; do
            response=$(curl --fail-with-body --silent --show-error --retry 3 \
              -H 'Content-Type: application/json' \
              --data-binary "$payload" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage")
            printf '%s\n' "$response" >> "$work/responses.jsonl"
            echo "$response"
          done < "$work/requests.jsonl"

          # The ids and texts are handed to the build-status workflow, which
          # edits the last message once Android CI has finished.
          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg pending "$pending_block" \
            --slurpfile requests "$work/requests.jsonl" \
            --slurpfile responses "$work/responses.jsonl" \
            '{
              chat_id: $chat_id,
              messages: [
                range(0; ($requests | length))
                | {message_id: $responses[.].result.message_id,
                   text: $requests[.].text,
                   # Exactly what was added at the end of the last message, so
                   # the build status can replace it literally.
                   pending: (if . == ($requests | length) - 1 then $pending else "" end)}
              ]
            }' > telegram-message.json

      - name: Save the message ids for the build status
        uses: actions/upload-artifact@v7.0.2
        with:
          name: telegram-message
          path: telegram-message.json
          retention-days: 1
          if-no-files-found: error
