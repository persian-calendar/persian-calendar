name: Build status

permissions: {}

on:
  workflow_run:
    workflows: [Android CI]
    types: [completed]
    branches: [main]

jobs:
  update-notification:
    name: Append the CI result to the Telegram notification
    runs-on: ubuntu-latest
    permissions:
      actions: read
    if: ${{ github.event.workflow_run.event == 'push' }}
    steps:
      - name: Edit the notification message
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -o pipefail

          # The message was sent by the push-triggered "Notify" run of this commit.
          notify_run="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/telegram-notify.yml/runs?head_sha=${HEAD_SHA}&event=push&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$notify_run" ]]; then
            echo "::warning::No push-triggered Notify run for ${HEAD_SHA}; nothing to update."
            exit 0
          fi

          work="$(mktemp -d)"
          for _ in {1..12}; do
            if gh run download "$notify_run" --name telegram-message --dir "$work" 2>/dev/null; then
              break
            fi
            # The Notify run may still be uploading its artifact.
            sleep 5
          done
          payload_file="$(find "$work" -name telegram-message.json -print -quit)"
          if [[ -z "$payload_file" ]]; then
            echo "::warning::No telegram-message artifact in Notify run ${notify_run}; nothing to update."
            exit 0
          fi
          if [[ "$(jq '.messages | length' "$payload_file")" -eq 0 ]]; then
            echo "::notice::The Notify run sent no message."
            exit 0
          fi

          # The exact pending block that was appended to the message, if any.
          pending_text="$(jq -r '.messages[-1].pending // ""' "$payload_file")"

          case "$CONCLUSION" in
            success)   icon='✅'; label='passed' ;;
            failure)   icon='❌'; label='failed' ;;
            cancelled) icon='⏹'; label='cancelled' ;;
            timed_out) icon='⌛'; label='timed out' ;;
            *)         icon='⚠️'; label="$CONCLUSION" ;;
          esac
          status_short="${icon} <a href=\"${CI_URL}\">Android CI</a> ${label}"

          # One line per job, using names that mean something to a reader.
          job_lines="$(gh run view "$CI_RUN_ID" --json jobs --jq '
            def esc: gsub("(?<a>[<>&\"])"; .a | @html);
            def friendly:
              if startswith("build-and-test-jvm") then "Build, lint & JVM tests"
              elif startswith("test-android") then
                (if test("\\([^)]+\\)$") then
                   "UI tests (Android " + (capture("\\((?<api>[^)]+)\\)").api) + " emulator)"
                 else "UI tests (emulator)" end)
              else . end;
            def icon:
              if . == "success" then "✅"
              elif . == "failure" then "❌"
              elif . == "cancelled" then "⏹"
              elif . == "skipped" then "⏭️"
              else "⚠️" end;

            .jobs
            | map("• \(.conclusion | icon) \(.name | friendly | esc)")
            | join("\n")' 2>/dev/null || true)"

          status="$status_short"
          [[ -n "$job_lines" ]] && status="${status_short}"$'\n'"${job_lines}"

          # Edit the last message only; earlier ones are just the overflow of a
          # long commit list. The status is inserted above the footer.
          payload="$(jq -c \
            --arg status "$status" \
            --arg status_short "$status_short" \
            --arg pending "$pending_text" '
              def w: if . > 65535 then 2 else 1 end;
              def u16len: [explode[] | w] | add // 0;
              def footer: "\n\n📅 @Persian_Calendar[^\n]*$";
              def old_pending: "⏳ Android CI is running…";

              .messages[-1] as $last
              | $last.text as $text
              # The pending block is stored verbatim in the artifact, so it can
              # be replaced literally instead of by pattern.
              | ($pending != "" and ($text | contains($pending))) as $replace
              # Messages sent before the per-job block existed only have this
              # single line; replace it the same way.
              | (($replace | not) and ($text | contains(old_pending))) as $legacy
              # With per-job lines too long, fall back to the one-line status
              # so the edited text can never exceed the 4096 limit.
              | (if (($text | u16len) + ($status | u16len) + 2) > 4096
                 then $status_short else $status end) as $line
              # Messages sent before the pending block existed get the result
              # inserted above the footer instead.
              | (if $replace
                 then ($text | split($pending) | join($line))
                 elif $legacy
                 then ($text | split(old_pending) | join($line))
                 elif ($text | test(footer))
                 then ($text | sub("(?<f>" + footer + ")"; "\n\n" + $line + .f))
                 else $text + "\n\n" + $line end) as $edited
              | (if (($edited | u16len) > 4096) and (($replace or $legacy) | not) and ($text | test(footer))
                 then ($text | sub("(?<f>" + footer + ")"; "\n\n" + $line))
                 else $edited end) as $final
              | if ($final | u16len) > 4096
                then null
                else {
                  chat_id: .chat_id,
                  message_id: $last.message_id,
                  parse_mode: "HTML",
                  text: $final
                } end' "$payload_file")"

          if [[ "$payload" == 'null' ]]; then
            echo "::warning::The notification message is too long for the CI result; not editing it."
            exit 0
          fi

          if response="$(curl --fail-with-body --silent --show-error --retry 3 \
                -H 'Content-Type: application/json' \
                --data-binary "$payload" \
                "https://api.telegram.org/bot${TELEGRAM_TOKEN}/editMessageText" 2>&1)"; then
            echo "$response"
            exit 0
          fi

          case "$response" in
            *'message is not modified'*)
              echo "::notice::The message already shows this CI result."
              ;;
            *'message to edit not found'*)
              echo "::warning::The notification message was deleted; nothing to update."
              ;;
            *)
              echo "$response"
              exit 1
              ;;
          esac
