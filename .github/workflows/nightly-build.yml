name: Nightly Build

on:
  workflow_dispatch: # To run the workflow manually if needed
  schedule:
    - cron: '22 8 * * *' # one a day

permissions:
  contents: read

jobs:
  evaluateChanges:
    name: Evaluate changes for run or skipping nightly build
    runs-on: ubuntu-latest
    outputs:
      SHOULD_BUILD: ${{ steps.check.outputs.shouldBuild }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Check
        id: check
        run: |
          if [[ $(git rev-list --after="24 hours" main) ]]; then
            echo shouldBuild=true >> $GITHUB_OUTPUT
          else
            echo shouldBuild=false >> $GITHUB_OUTPUT
          fi

  build:
    name: Generate Nightly Build
    runs-on: ubuntu-latest
    needs: evaluateChanges
    if: ${{ needs.evaluateChanges.outputs.SHOULD_BUILD == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Build and send apks to telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ./gradlew assembleNightly
          apk_path="$(find . -type f -iname '*.apk' -print -quit)"
          apk_kb=$(( ($(wc -c <"$apk_path") + 1023) / 1024 ))
          curl --fail-with-body --silent --show-error --retry 3 \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=Size: ${apk_kb}K" \
            -F parse_mode=HTML \
            -F "document=@${apk_path}"
          rm "$apk_path"

  update-report:
    name: Update the runtime dependencies report
    needs: build
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/update-dependencies-report.yml
    with:
      ref: ${{ github.ref_name }}
